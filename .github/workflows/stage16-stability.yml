name: Stage 16 stability audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    name: Stability and browser startup checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run release quality checks
        run: node scripts/quality-check.mjs
      - name: Run stability and performance audit
        run: node scripts/stability-check.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Run real-browser startup smoke test
        run: node scripts/browser-smoke.mjs
