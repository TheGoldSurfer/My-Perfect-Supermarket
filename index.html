<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Perfect Supermarket</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101a22;color:#f5f7f8;font:16px system-ui,sans-serif}
main{width:min(520px,calc(100% - 32px));padding:32px;border:1px solid #34434e;border-radius:18px;background:#192630;text-align:center;box-shadow:0 18px 60px #0007}
h1{margin:0 0 12px;font-size:clamp(26px,6vw,38px)}p{color:#c5d0d7;line-height:1.5}#status{color:#9ee6c0}#retry{margin-top:16px;border:1px solid #5a7c96;border-radius:10px;padding:10px 16px;background:#29475c;color:#f5f7f8;font:700 14px system-ui;cursor:pointer}#retry:hover{background:#355a73}#retry[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1>My Perfect Supermarket</h1>
<p id="status">Loading My Perfect Supermarket…</p>
<button id="retry" type="button" hidden>Retry loading</button>
<noscript>JavaScript is required to play this game.</noscript>
</main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const response=await fetch('./game-source.html',{cache:'no-store'});
  if(!response.ok)throw new Error('Could not load the game source (HTTP '+response.status+').');
  let html=await response.text();
  const stage14Addon="\n<style id=\"stage14-stock-style\">\n#s14-launch{position:fixed;z-index:99990;right:18px;top:18px;border:1px solid #54718a;border-radius:12px;background:#142638;color:#f3f7fb;padding:11px 15px;font:700 12px system-ui;letter-spacing:.08em;cursor:pointer;box-shadow:0 8px 28px #0008}\n#s14-launch:hover{background:#203c54}\n#s14-wrap{position:fixed;z-index:99991;inset:0;background:#07111de8;display:none;align-items:center;justify-content:center;padding:16px;font:14px system-ui;color:#e9f1f8}\n#s14-panel{width:min(980px,100%);max-height:92vh;overflow:auto;background:#101f30;border:1px solid #304b63;border-radius:18px;box-shadow:0 24px 80px #000b}\n#s14-panel *{box-sizing:border-box}\n.s14-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #2b4054}\n.s14-head h2{margin:0;font-size:19px}.s14-sub{color:#9eb2c4;font-size:12px;margin-top:4px}\n.s14-close,.s14-btn{border:1px solid #48627a;background:#1b3349;color:#eaf3fb;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:650}\n.s14-close{font-size:18px;padding:5px 11px}\n.s14-tabs{display:flex;gap:7px;flex-wrap:wrap;padding:13px 18px 0}\n.s14-tab{border:1px solid #344e64;background:#172a3c;color:#b8c9d8;border-radius:9px;padding:9px 13px;cursor:pointer}\n.s14-tab.active{background:#254b68;color:white;border-color:#6ca8ce}\n.s14-body{padding:16px 20px 22px}\n.s14-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}\n.s14-stat{background:#172a3c;border:1px solid #2b4359;border-radius:12px;padding:12px}\n.s14-stat b{display:block;font-size:21px}.s14-stat span{color:#9eb2c4;font-size:11px;text-transform:uppercase;letter-spacing:.07em}\n.s14-table{width:100%;border-collapse:collapse;font-size:13px}.s14-table th,.s14-table td{padding:11px 9px;text-align:left;border-bottom:1px solid #263b4e}.s14-table th{color:#9eb2c4;font-size:11px;text-transform:uppercase;letter-spacing:.06em}\n.s14-pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;background:#243b4d;color:#c6d9e8}.s14-low{background:#503b22;color:#ffd99b}.s14-good{background:#1d493b;color:#a8f0d1}.s14-bad{background:#552d35;color:#ffc0c8}\n.s14-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.s14-row select,.s14-row input{background:#0d1b29;color:#eaf3fb;border:1px solid #3a5268;border-radius:8px;padding:8px;min-width:80px}\n.s14-btn.primary{background:#27628a;border-color:#468ab5}.s14-btn:disabled{opacity:.4;cursor:not-allowed}\n.s14-card{background:#172a3c;border:1px solid #2b4359;border-radius:12px;padding:14px;margin-bottom:10px}\n.s14-empty{padding:28px;text-align:center;color:#9eb2c4}\n@media(max-width:600px){#s14-launch{top:10px;right:10px;padding:9px 11px}.s14-head,.s14-body{padding-left:13px;padding-right:13px}.s14-stats{grid-template-columns:1fr 1fr}.s14-table{font-size:12px}.s14-table th,.s14-table td{padding:8px 5px}}\n</style>\n<button id=\"s14-launch\" type=\"button\">STOCK &amp; ORDERS</button>\n<div id=\"s14-wrap\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Stock and ordering management\">\n <section id=\"s14-panel\">\n  <header class=\"s14-head\"><div><h2>Stock &amp; Ordering</h2><div class=\"s14-sub\">Stage 14 · Product ordering and inventory desk</div></div><button class=\"s14-close\" id=\"s14-close\" aria-label=\"Close\">×</button></header>\n  <nav class=\"s14-tabs\" id=\"s14-tabs\">\n   <button class=\"s14-tab active\" data-tab=\"stock\">Stock overview</button><button class=\"s14-tab\" data-tab=\"order\">Place order</button><button class=\"s14-tab\" data-tab=\"deliveries\">Incoming deliveries</button><button class=\"s14-tab\" data-tab=\"shelves\">Shelf compatibility</button>\n  </nav>\n  <main class=\"s14-body\" id=\"s14-content\"></main>\n </section>\n</div>\n<script id=\"stage14-stock-script\">(()=>{\n let bridge=null,state=null,active='stock',ready=false;\n const el=id=>document.getElementById(id);\n const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');\n const KEY='mps_stage14_inventory_v2';\n function init(){\n  if(ready||!window.MPSGameBridge)return;\n  bridge=window.MPSGameBridge;if(bridge.version!==1)return;ready=true;\n  const tabs=Array.from(document.querySelectorAll('.s14-tab'));\n  let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}\n  const old=(Array.isArray(saved.products)?saved.products:[]).concat((()=>{try{const x=JSON.parse(localStorage.getItem('mps_stage14_inventory_v1')||'null');return x&&Array.isArray(x.products)?x.products:[]}catch(e){return []}})());\n  state={products:bridge.getProducts().map((g,i)=>{\n   const prior=old.find(x=>x.gameKey===g.key)||old.find(x=>norm(x.name)===norm(g.name));\n   return {id:i+1,gameKey:g.key,name:g.name,category:g.department|| (g.cold?'Chilled':'Grocery'),type:g.requiredFixture,min:Math.max(0,Math.floor(Number(prior&&prior.min)||10)),cost:g.cost,price:g.price,unlocked:g.unlocked};\n  }),deliveries:[],crates:[],fixtures:[]};\n  const find=id=>state.products.find(p=>p.id===Number(id)||p.gameKey===String(id)||norm(p.name)===norm(id));\n  const saveSettings=()=>{try{localStorage.setItem(KEY,JSON.stringify({version:2,products:state.products.map(p=>({gameKey:p.gameKey,name:p.name,min:p.min}))}))}catch(e){}};\n  const sync=()=>{\n   state.products.forEach(p=>{const x=bridge.getInventory(p.gameKey)||{};p.warehouse=Number(x.warehouse)||0;p.shelfStock=Number(x.shelf)||0;p.stock=Number(x.onHand)||0;p.incoming=Number(x.incoming)||0;p.shelfCount=Number(x.shelfCount)||0});\n   state.deliveries=bridge.getDeliveries()||[];state.crates=bridge.getCrates()||[];state.fixtures=bridge.getFixtures()||[];\n  };\n  const snapshot=()=>{sync();return {version:2,createdAt:new Date().toISOString(),products:state.products.map(p=>({gameKey:p.gameKey,name:p.name,stock:p.stock,warehouse:p.warehouse,shelfStock:p.shelfStock,min:p.min}))}};\n  const emit=()=>window.dispatchEvent(new CustomEvent('mps:inventory:changed',{detail:snapshot()}));\n  window.MPSInventory=Object.freeze({\n   version:2,getSnapshot:snapshot,\n   getProducts:()=>{sync();return state.products.map(p=>({...p}))},\n   getDeliveries:()=>{sync();return state.deliveries.map(d=>({...d}))},\n   getStock:id=>{sync();const p=find(id);return p?p.stock:null},\n   setStock:(id,n,source='external')=>{const p=find(id),v=Number(n);if(!p||!Number.isFinite(v)||v<0||!bridge.setStock(p.gameKey,Math.floor(v)))return false;sync();emit();window.dispatchEvent(new CustomEvent('mps:inventory:stock-adjusted',{detail:{gameKey:p.gameKey,product:p.name,quantity:p.stock,source}}));return true},\n   adjustStock:(id,delta,source='external')=>{const p=find(id),v=Number(delta);if(!p||!Number.isFinite(v)||v===0||!bridge.adjustStock(p.gameKey,Math.trunc(v)))return false;sync();emit();window.dispatchEvent(new CustomEvent('mps:inventory:stock-adjusted',{detail:{gameKey:p.gameKey,product:p.name,quantity:p.stock,source}}));return p.stock},\n   addProduct:()=>false,\n   createOrder:(id,boxes)=>{const p=find(id),n=Math.floor(Number(boxes));if(!p||!Number.isFinite(n)||n<1||n>10)return false;const result=bridge.order(p.gameKey,n);sync();emit();if(el('s14-wrap').style.display==='flex')render();return result},\n   receiveDelivery:id=>{const ok=bridge.receive(Number(id));if(!ok)return false;sync();emit();if(el('s14-wrap').style.display==='flex')render();return true},\n   setShelfType:(id,type)=>{const p=find(id);return !!p&&p.type===type},\n   importBackup:data=>{if(!data||!Array.isArray(data.products))return false;let changed=false;data.products.forEach(x=>{const p=find(x.gameKey||x.name);if(!p)return;if(Number.isFinite(Number(x.min)))p.min=Math.max(0,Math.min(99999,Math.floor(Number(x.min))));if(Number.isFinite(Number(x.stock))&&Number(x.stock)>=0)bridge.setStock(p.gameKey,Math.floor(Number(x.stock)));changed=true});if(!changed)return false;saveSettings();sync();emit();render();return true},\n   subscribe:fn=>{if(typeof fn!=='function')return()=>{};const listener=e=>fn(e.detail);window.addEventListener('mps:inventory:changed',listener);return()=>window.removeEventListener('mps:inventory:changed',listener)}\n  });\n  const header=el('s14-panel').querySelector('.s14-head');\n  const tools=document.createElement('div');tools.className='s14-row';tools.style.marginLeft='auto';\n  tools.innerHTML='<button class=\"s14-btn\" id=\"s14-export\">Export backup</button><button class=\"s14-btn\" id=\"s14-import-trigger\">Import backup</button><input id=\"s14-import-file\" type=\"file\" accept=\"application/json,.json\" hidden>';\n  header.insertBefore(tools,el('s14-close'));\n  el('s14-export').onclick=()=>{const blob=new Blob([JSON.stringify(window.MPSInventory.getSnapshot(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-perfect-supermarket-inventory.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};\n  el('s14-import-trigger').onclick=()=>el('s14-import-file').click();\n  el('s14-import-file').onchange=async ev=>{const file=ev.target.files&&ev.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!window.MPSInventory.importBackup(data))alert('No matching game products were found in that backup.');else{active='stock';tabs.forEach(t=>t.classList.toggle('active',t.dataset.tab==='stock'));render()}}catch(e){alert('Could not read that backup file.')}ev.target.value=''};\n  function open(){sync();el('s14-wrap').style.display='flex';render()}\n  function close(){el('s14-wrap').style.display='none'}\n  el('s14-launch').onclick=open;el('s14-close').onclick=close;\n  el('s14-wrap').addEventListener('click',ev=>{if(ev.target===el('s14-wrap'))close()});\n  document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&el('s14-wrap').style.display==='flex')close()});\n  tabs.forEach(t=>t.addEventListener('click',()=>{active=t.dataset.tab;tabs.forEach(x=>x.classList.toggle('active',x===t));render()}));\n  const stats=()=>{const units=state.products.reduce((n,p)=>n+p.stock,0),low=state.products.filter(p=>p.stock<=p.min).length;return '<div class=\"s14-stats\"><div class=\"s14-stat\"><b>'+units+'</b><span>Units on hand</span></div><div class=\"s14-stat\"><b>'+low+'</b><span>Products to replenish</span></div><div class=\"s14-stat\"><b>'+state.deliveries.length+'</b><span>Deliveries in transit</span></div></div>'};\n  function render(){\n   sync();let html=stats();\n   if(active==='stock'){\n    html+='<div class=\"s14-row\" style=\"justify-content:space-between;margin-bottom:10px\"><b>Live game inventory</b><span class=\"s14-pill\">Real warehouse + shelf stock</span></div><table class=\"s14-table\"><thead><tr><th>Product</th><th>Fixture</th><th>Shelves</th><th>Warehouse</th><th>On hand</th><th>Reorder at</th><th>Status</th></tr></thead><tbody>';\n    state.products.forEach(p=>{const low=p.stock<=p.min;html+='<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.type)+'</td><td>'+p.shelfStock+'</td><td>'+p.warehouse+'</td><td><b>'+p.stock+'</b></td><td><input data-min=\"'+p.id+'\" type=\"number\" min=\"0\" max=\"99999\" value=\"'+p.min+'\" aria-label=\"Reorder threshold\"></td><td><span class=\"s14-pill '+(low?'s14-low':'s14-good')+'\">'+(low?'Replenish':'Healthy')+'</span></td></tr>'});\n    html+='</tbody></table><p class=\"s14-sub\">Counts are read from real game shelves, warehouse stock and supplier orders. Reorder thresholds are saved on this device.</p>';\n   }else if(active==='order'){\n    html+='<div class=\"s14-card\"><b>Place a supplier order</b><p class=\"s14-sub\">Each box contains 12 units. The game checks unlocks and cash, charges its real supplier price and sends crates to the loading bay.</p><div class=\"s14-row\"><select id=\"s14-product\">';\n    state.products.forEach(p=>{html+='<option value=\"'+p.id+'\" '+(p.unlocked?'':'disabled')+'>'+esc(p.name)+' · '+(p.unlocked?'$'+p.cost+' per box':'Locked')+'</option>'});\n    html+='</select><input id=\"s14-qty\" type=\"number\" min=\"1\" max=\"10\" value=\"1\" aria-label=\"Number of boxes\"><button class=\"s14-btn primary\" id=\"s14-place\">Place order</button></div><div class=\"s14-sub\" id=\"s14-order-message\" aria-live=\"polite\" style=\"margin-top:8px\"></div></div><table class=\"s14-table\"><thead><tr><th>Product</th><th>On hand</th><th>Reorder at</th><th>Suggested boxes</th></tr></thead><tbody>';\n    state.products.filter(p=>p.stock<=p.min&&p.unlocked).forEach(p=>{html+='<tr><td>'+esc(p.name)+'</td><td>'+p.stock+'</td><td>'+p.min+'</td><td>'+Math.max(1,Math.ceil((p.min*2-p.stock)/12))+'</td></tr>'});\n    html+='</tbody></table>';\n    setTimeout(()=>{const b=el('s14-place');if(!b)return;b.onclick=()=>{const p=find(el('s14-product').value),n=Math.floor(Number(el('s14-qty').value)),msg=el('s14-order-message');if(!p||!Number.isFinite(n)||n<1||n>10){msg.textContent='Choose an unlocked product and 1–10 boxes.';return}const result=window.MPSInventory.createOrder(p.id,n);if(!result||!result.ok){msg.textContent=result&&result.reason==='locked'?'That product is still locked.':result&&result.reason==='funds'?'Not enough cash for this order.':'The order could not be placed.';return}msg.textContent='Ordered '+result.units+' units of '+p.name+'. Delivery will reach the loading bay in about five seconds.'}},0);\n   }else if(active==='deliveries'){\n    html+='<b>Incoming supplier deliveries</b><p class=\"s14-sub\">These are the game’s real deliveries. Unload now creates a physical crate at the loading bay.</p>';\n    if(!state.deliveries.length)html+='<div class=\"s14-empty\">No orders currently in transit.</div>';\n    state.deliveries.forEach(d=>{html+='<div class=\"s14-card\"><div class=\"s14-row\" style=\"justify-content:space-between\"><div><b>'+esc(d.name)+'</b><div class=\"s14-sub\">'+d.qty+' units · '+Math.max(0,Math.ceil(d.left))+' seconds remaining</div></div><span class=\"s14-pill s14-low\">In transit</span></div><div style=\"margin-top:12px\"><button class=\"s14-btn primary\" data-receive=\"'+d.id+'\">Unload now</button></div></div>'});\n    html+='<b>Crates in loading bay</b>';if(!state.crates.length)html+='<div class=\"s14-empty\">No arrived crates waiting to be picked up.</div>';\n    state.crates.forEach(c=>{html+='<div class=\"s14-card\"><div class=\"s14-row\" style=\"justify-content:space-between\"><div><b>'+esc(c.name)+'</b><div class=\"s14-sub\">'+c.qty+' units · Pick up in the 3D store</div></div><span class=\"s14-pill s14-good\">Arrived</span></div></div>'});\n    setTimeout(()=>document.querySelectorAll('[data-receive]').forEach(b=>b.onclick=()=>window.MPSInventory.receive(b.dataset.receive)),0);\n   }else{\n    html+='<b>Live fixture compatibility</b><p class=\"s14-sub\">This view checks actual fixtures built in your supermarket.</p>';\n    if(!state.fixtures.length)html+='<div class=\"s14-empty\">Build shelves or department displays to see them here.</div>';\n    else{const names={shelf:'Grocery shelf',fridge:'Display fridge',bakery:'Bakery display',butcher:'Butcher counter',flower:'Flower stand',toy:'Toy display',electronics:'Electronics counter'};html+='<table class=\"s14-table\"><thead><tr><th>Fixture</th><th>Floor</th><th>Product</th><th>Stock</th><th>Capacity</th><th>Check</th></tr></thead><tbody>';state.fixtures.forEach(f=>{const status=!f.product?'Unassigned':f.compatible?'Compatible':'Mismatch',cls=!f.product?'':f.compatible?'s14-good':'s14-bad';html+='<tr><td>'+esc(names[f.kind]||f.label)+'</td><td>'+(f.floor>0.15?'Upper':'Ground')+'</td><td>'+esc(f.productName||'—')+'</td><td>'+f.stock+'</td><td>'+f.capacity+'</td><td><span class=\"s14-pill '+cls+'\">'+status+'</span></td></tr>'});html+='</tbody></table>'}\n    html+='<div class=\"s14-card\"><b>Game product catalogue</b><p class=\"s14-sub\">All '+state.products.length+' products are read from the game catalogue and unlock through normal progression. This game does not support adding custom product types.</p></div>';\n   }\n   el('s14-content').innerHTML=html;\n   if(active==='stock'){\n    document.querySelectorAll('[data-min]').forEach(input=>input.addEventListener('change',()=>{const p=find(input.dataset.min);if(p){p.min=Math.max(0,Math.min(99999,Math.floor(Number(input.value)||0)));saveSettings();emit();render()}}));\n    const box=document.createElement('div');box.className='s14-card';\n    box.innerHTML='<b>Manual stock adjustment</b><p class=\"s14-sub\">Adding stock creates a real delivery crate. Removing stock consumes warehouse stock first, then shelf stock.</p><div class=\"s14-row\"><select id=\"s14-adjust-product\">'+state.products.map(p=>'<option value=\"'+p.id+'\">'+esc(p.name)+' · '+p.stock+' on hand</option>').join('')+'</select><input id=\"s14-adjust-qty\" type=\"number\" min=\"1\" max=\"9999\" value=\"1\" aria-label=\"Adjustment quantity\"><button class=\"s14-btn primary\" id=\"s14-add-stock\">Add stock</button><button class=\"s14-btn\" id=\"s14-remove-stock\">Remove stock</button></div><div class=\"s14-sub\" id=\"s14-stock-message\" aria-live=\"polite\" style=\"margin-top:8px\"></div>';\n    el('s14-content').appendChild(box);\n    const adjust=sign=>{const p=find(el('s14-adjust-product').value),n=Math.floor(Number(el('s14-adjust-qty').value)),msg=el('s14-stock-message');if(!p||!Number.isFinite(n)||n<1){msg.textContent='Enter a quantity greater than zero.';return}const ok=window.MPSInventory.adjustStock(p.id,sign*n,'management-desk');msg.textContent=ok?'Updated the live game stock.':'Could not adjust stock. Check available stock and try again.'};\n    el('s14-add-stock').onclick=()=>adjust(1);el('s14-remove-stock').onclick=()=>adjust(-1);\n   }\n  }\n  sync();render();emit();\n  setInterval(()=>{const before=JSON.stringify([state.products.map(p=>[p.stock,p.warehouse,p.shelfStock,p.incoming,p.min]),state.deliveries,state.crates,state.fixtures.map(f=>[f.kind,f.product,f.stock,f.capacity])]);sync();const after=JSON.stringify([state.products.map(p=>[p.stock,p.warehouse,p.shelfStock,p.incoming,p.min]),state.deliveries,state.crates,state.fixtures.map(f=>[f.kind,f.product,f.stock,f.capacity])]);if(before!==after){emit();if(el('s14-wrap').style.display==='flex'&&!el('s14-content').contains(document.activeElement))render()}},1000);\n }\n if(window.MPSGameBridge)init();else window.addEventListener('mps-game:ready',init,{once:true});\n})();<\/script>"
  const closeAt=html.toLowerCase().lastIndexOf('</body>');
  if(closeAt>=0)html=html.slice(0,closeAt)+stage14Addon+html.slice(closeAt);
  document.open();document.write(html);document.close();
 }catch(error){
  status.textContent='The game could not start: '+(error&&error.message?error.message:String(error));
  status.style.color='#ffb4a9';
  const retry=document.getElementById('retry');
  retry.hidden=false;
  retry.addEventListener('click',()=>location.reload(),{once:true});
 }
})();
</script>
</body>
</html>
