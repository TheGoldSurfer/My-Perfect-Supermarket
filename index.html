<main><h1>My Perfect Supermarket</h1><p id="status">Loading Stage 11 performance update…</p><noscript>JavaScript is required to play this game.</noscript></main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  if(!('DecompressionStream' in window))throw new Error('Please use a recent version of Chrome, Edge, Firefox or Safari.');
  const names=['game-part-1.b64','game-part-2.b64','game-part-3.b64','game-part-4.b64','game-part-5.b64'];
  const parts=await Promise.all(names.map(async name=>{const response=await fetch('./'+name,{cache:'no-store'});if(!response.ok)throw new Error('Could not load '+name+' (HTTP '+response.status+').');return (await response.text()).trim()}));
  const binary=atob(parts.join(''));const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  const replaceOnce=(before,after,label)=>{if(!html.includes(before))throw new Error('Stage 11 patch mismatch: '+label);html=html.replace(before,after)};
  replaceOnce("const mat=(color,rough=.78,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});","const sharedMaterials=new Set(),sharedGeometries=new Set(),materialCache=new Map(),geometryCache=new Map();\nfunction mat(color,rough=.78,metal=0){const key=[color,rough,metal].join('|');let m=materialCache.get(key);if(!m){m=new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});materialCache.set(key,m);sharedMaterials.add(m)}return m}\nfunction cachedGeometry(key,make){let g=geometryCache.get(key);if(!g){g=make();geometryCache.set(key,g);sharedGeometries.add(g)}return g}\nconst boxGeometry=(x,y,z)=>cachedGeometry('box:'+x+'|'+y+'|'+z,()=>new THREE.BoxGeometry(x,y,z));\nconst cylinderGeometry=(a,b,h,n=16)=>cachedGeometry('cylinder:'+a+'|'+b+'|'+h+'|'+n,()=>new THREE.CylinderGeometry(a,b,h,n));\nconst sphereGeometry=(r,w=16,h=12)=>cachedGeometry('sphere:'+r+'|'+w+'|'+h,()=>new THREE.SphereGeometry(r,w,h));\nconst planeGeometry=(w,h)=>cachedGeometry('plane:'+w+'|'+h,()=>new THREE.PlaneGeometry(w,h));","cache duplicate materials and geometries");
  replaceOnce("function disposeDynamicTree(root){if(!root)return;root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];for(const m of mats){if(m.map)m.map.dispose();m.dispose()}}})}","function disposeDynamicTree(root){if(!root)return;const disposedTextures=new Set();root.traverse(o=>{if(o.geometry&&!sharedGeometries.has(o.geometry))o.geometry.dispose();if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];for(const m of mats){if(sharedMaterials.has(m))continue;if(m.map&&!disposedTextures.has(m.map)){disposedTextures.add(m.map);m.map.dispose()}m.dispose()}}})}","safe disposal with shared geometry");
  replaceOnce("const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);","const o=new THREE.Mesh(boxGeometry(sx,sy,sz),material);","box geometry cache");
  replaceOnce("const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);","const o=new THREE.Mesh(cylinderGeometry(r1,r2,h,segments),material);","cylinder geometry cache");
  replaceOnce("new THREE.SphereGeometry(.28,10,8)","sphereGeometry(.28,10,8)","cache repeated geometry");
  replaceOnce("new THREE.SphereGeometry(.18,10,8)","sphereGeometry(.18,10,8)","cache repeated geometry");
  replaceOnce("new THREE.SphereGeometry(.22,14,12)","sphereGeometry(.22,14,12)","cache repeated geometry");
  replaceOnce("new THREE.SphereGeometry(.23,12,10)","sphereGeometry(.23,12,10)","cache repeated geometry");
  replaceOnce("new THREE.SphereGeometry(.23,14,12)","sphereGeometry(.23,14,12)","cache repeated geometry");
  replaceOnce("new THREE.SphereGeometry(.24,12,10)","sphereGeometry(.24,12,10)","cache repeated geometry");
  replaceOnce("new THREE.SphereGeometry(.24,12,8)","sphereGeometry(.24,12,8)","cache repeated geometry");
  replaceOnce("new THREE.PlaneGeometry(7.2,1.2)","planeGeometry(7.2,1.2)","cache repeated geometry");
  replaceOnce("new THREE.PlaneGeometry(.82,.26)","planeGeometry(.82,.26)","cache repeated geometry");
  replaceOnce("firstPersonArms.visible=false;","firstPersonArms.clear();armMeshes.length=0;\narmMaterials.sleeve=new THREE.MeshStandardMaterial({color:0x3e77a8,roughness:.82});armMaterials.skin=new THREE.MeshStandardMaterial({color:0xc58d68,roughness:.9});armMaterials.cuff=new THREE.MeshStandardMaterial({color:0x263544,roughness:.78});\nfor(const side of [-1,1]){const arm=new THREE.Group();arm.position.set(side*.39,-.16,-.76);arm.rotation.set(-.12,side*-.035,side*.14);const sleeve=new THREE.Mesh(cylinderGeometry(.088,.112,.43,9),armMaterials.sleeve);sleeve.position.set(0,.045,0);sleeve.castShadow=false;sleeve.receiveShadow=false;arm.add(sleeve);const cuff=new THREE.Mesh(cylinderGeometry(.091,.091,.065,9),armMaterials.cuff);cuff.position.set(0,-.205,-.005);cuff.castShadow=false;arm.add(cuff);const hand=new THREE.Group();hand.position.set(0,-.275,-.055);arm.add(hand);const palm=new THREE.Mesh(boxGeometry(.145,.095,.16),armMaterials.skin);palm.castShadow=false;hand.add(palm);for(let i=0;i<4;i++){const finger=new THREE.Mesh(boxGeometry(.029,.082,.045),armMaterials.skin);finger.position.set(-.052+i*.035,-.065,-.055);finger.castShadow=false;hand.add(finger)}const thumb=new THREE.Mesh(boxGeometry(.045,.075,.052),armMaterials.skin);thumb.position.set(side*.082,-.012,.005);thumb.rotation.z=side*-.48;thumb.castShadow=false;hand.add(thumb);firstPersonArms.add(arm);armMeshes.push({sleeve,hand})}\nfirstPersonArms.renderOrder=5;firstPersonArms.visible=true;","replace hidden arms with camera viewmodel");
  replaceOnce("const raycaster=new THREE.Raycaster(); raycaster.far=5.2; const center=new THREE.Vector2(0,0);","const raycaster=new THREE.Raycaster();raycaster.far=5.2;raycaster.params.Line.threshold=.12;const center=new THREE.Vector2(0,0);let raycastTargets=[],lastRaycastRefresh=0;const moveDirection=new THREE.Vector3(),moveRight=new THREE.Vector3(),upDirection=new THREE.Vector3(0,1,0);","reusable raycast and movement vectors");
  replaceOnce("function updateTarget(){if(stockingTask)","function updateTarget(){const rayNow=performance.now();if(rayNow-lastRaycastRefresh>650){raycastTargets=worldObjects.filter(o=>o.visible);lastRaycastRefresh=rayNow}if(stockingTask)","cache visible raycast objects");
  replaceOnce("raycaster.intersectObjects(worldObjects.filter(o=>o.visible),true)","raycaster.intersectObjects(raycastTargets,true)","reuse raycast object list");

  replaceOnce("let lastT=performance.now(), elapsed=0, velocityY=0, onGround=true, keys={}, moveTouch={}; let gameStarted=false,gamePaused=false;let gameSettings={sensitivity:1,fov:74,quality:'low'}; let lastTargetCheck=0,lastHudUpdate=0,lastDeliveryUiUpdate=0,lastRenderAt=0;","let lastT=performance.now(),elapsed=0,velocityY=0,onGround=true,keys={},moveTouch={};let gameStarted=false,gamePaused=false;let gameSettings={sensitivity:1,fov:74,quality:'low'};let lastTargetCheck=0,lastHudUpdate=0,lastDeliveryUiUpdate=0,lastRenderAt=0,lastAdaptiveCheck=performance.now(),renderCostTotal=0,renderCostSamples=0,adaptiveScale=1;","adaptive renderer state");
  replaceOnce("const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio||1,1)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=false; renderer.shadowMap.type=THREE.BasicShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; $('game').appendChild(renderer.domElement);","const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance',stencil:false,depth:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,.85));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.shadowMap.type=THREE.BasicShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;$('game').appendChild(renderer.domElement);","lighter renderer defaults");

  replaceOnce("backdrop-filter:blur(9px)","backdrop-filter:none","remove expensive full-screen menu blur");
  replaceOnce("function spawnCustomer(){if(!storeOpen||customers.length>=8)return;","function spawnCustomer(){const maxCustomers=gameSettings.quality==='low'?5:gameSettings.quality==='medium'?7:9;if(!storeOpen||customers.length>=maxCustomers)return;","quality scaled customer cap");

  replaceOnce("function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-lastT)/1000);lastT=now;","function animate(now){requestAnimationFrame(animate);if(document.hidden){lastT=now;return}const dt=Math.min(.05,(now-lastT)/1000);lastT=now;","skip hidden tab rendering");
  replaceOnce("const frameGap=!gameStarted||gamePaused?1000/15:gameSettings.quality==='low'?1000/45:1000/60;if(now-lastRenderAt>=frameGap){renderer.render(scene,camera);lastRenderAt=now}}","const frameGap=!gameStarted||gamePaused?1000/12:gameSettings.quality==='low'?1000/30:gameSettings.quality==='medium'?1000/45:1000/60;if(now-lastRenderAt>=frameGap){const renderStart=performance.now();renderer.render(scene,camera);renderCostTotal+=performance.now()-renderStart;renderCostSamples++;lastRenderAt=now}if(now-lastAdaptiveCheck>3000&&renderCostSamples){const average=renderCostTotal/renderCostSamples;let changed=false;if(average>24&&adaptiveScale>.62){adaptiveScale=Math.max(.62,adaptiveScale-.1);changed=true}else if(average<12&&adaptiveScale<1){adaptiveScale=Math.min(1,adaptiveScale+.04);changed=true}renderCostTotal=0;renderCostSamples=0;lastAdaptiveCheck=now;if(changed){const q=gameSettings.quality||'low',cap=q==='low'?.85:q==='medium'?1:1.25,mobile=matchMedia('(max-width: 700px)').matches;renderer.setPixelRatio(Math.max(.6,Math.min(devicePixelRatio||1,cap)*(mobile?.9:1)*adaptiveScale));lastRenderAt=0}}}","adaptive fps cap and render resolution");

  replaceOnce("Medium · 60 FPS, no shadows","Medium · 45 FPS, no shadows","medium preset label");

    replaceOnce("<button id=\"buildBtn\">BUILD</button>\n    <button id=\"interactBtn\">E · INTERACT</button>","<button id=\"buildBtn\">▦ BUILD</button>\n    <button id=\"phoneBtn\" class=\"phone-shortcut\" aria-label=\"Open phone\">▣ PHONE</button>\n    <button id=\"interactBtn\">E · INTERACT</button>","Stage 12 dedicated phone button");

    replaceOnce("</style>","/* STAGE 12 · NAVY BLUE MANAGEMENT INTERFACE */\n:root{--ink:#edf4fb;--muted:#9eafc3;--panel:rgba(13,25,41,.97);--line:#2b4058;--blue:#4a9df0;--green:#4bb98b;--amber:#edbd65;--red:#f07171}\nbody{background:#07111d;color:#edf4fb}\n.brand,.stat,.toolbar button,.panel,.toast,.hint{background:rgba(12,25,41,.94);border-color:#31445d;color:#eaf2fa;box-shadow:0 12px 34px rgba(0,0,0,.25)}\n.brand{color:#fff;border-color:#36506d}.brand small{color:#91a9c3}.stat{color:#9fb2c7}.stat b{color:#f7fbff}\n.toolbar{gap:8px;padding:8px;border:1px solid rgba(116,151,188,.24);background:rgba(7,18,31,.82);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.3)}\n.toolbar button{min-width:88px;border:1px solid #314963;background:#13263b;color:#dce9f8;padding:11px 13px;border-radius:11px;transition:background .16s,border-color .16s,transform .16s}\n.toolbar button:hover,.toolbar button.active{background:#1e3c5c;border-color:#5795cf;color:#fff;transform:translateY(-1px)}\n.toolbar button.primary{background:linear-gradient(135deg,#2678c7,#3e9bdd);border-color:#56a6e5;color:#fff}\n.toolbar button.phone-shortcut{background:linear-gradient(135deg,#194c65,#1c7184);border-color:#3c91a6;color:#effcff}\n.toolbar button:focus-visible,.menu-btn:focus-visible,.hub-tile:focus-visible,.action:focus-visible{outline:2px solid #75bbff;outline-offset:2px}\n.hint{background:rgba(8,21,36,.92);border-color:#314963;color:#dce9f6}.rightnote{background:rgba(8,20,34,.86);border:1px solid #30465d;color:#d9e7f4}\n.panel{background:linear-gradient(160deg,#12253a 0%,#0c1a2b 100%);border:1px solid #38506b;color:#eaf2fb;box-shadow:0 24px 80px rgba(0,0,0,.48);width:min(700px,calc(100% - 28px));max-height:min(84vh,820px);padding:22px}\n.panel h2{color:#f5f9ff;font-size:24px;letter-spacing:-.025em}.panel h3{color:#dce9f7}.panel .sub{color:#9eb1c6}\n.panel-head{border-bottom:1px solid rgba(124,158,194,.2);padding-bottom:12px;margin-bottom:16px}.panel-head strong{font-size:11px;letter-spacing:.1
