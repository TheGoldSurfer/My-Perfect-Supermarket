<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Perfect Supermarket</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101a22;color:#f5f7f8;font:16px system-ui,sans-serif}
main{width:min(520px,calc(100% - 32px));padding:32px;border:1px solid #34434e;border-radius:18px;background:#192630;text-align:center;box-shadow:0 18px 60px #0007}
h1{margin:0 0 12px;font-size:clamp(26px,6vw,38px)}p{color:#c5d0d7;line-height:1.5}#status{color:#9ee6c0}
</style>
</head>
<body>
<main>
<h1>My Perfect Supermarket</h1>
<p id="status">Loading Stage 13 building-system update…</p>
<noscript>JavaScript is required to play this game.</noscript>
</main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  if(!('DecompressionStream' in window))throw new Error('Please use a recent version of Chrome, Edge, Firefox or Safari.');
  const names=["game-part-1.b64","game-part-2.b64","game-part-3.b64","game-part-4.b64","game-part-5.b64","game-part-6.b64","game-part-7.b64","game-part-8.b64","game-part-9.b64","game-part-10.b64","game-part-11.b64","game-part-12.b64","game-part-13.b64","game-part-14.b64","game-part-15.b64","game-part-16.b64"];
  const parts=await Promise.all(names.map(async name=>{
   const response=await fetch('./'+name,{cache:'no-store'});
   if(!response.ok)throw new Error('Could not load '+name+' (HTTP '+response.status+').');
   return (await response.text()).trim();
  }));
  const binary=atob(parts.join(''));
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  const stage14Addon="\n<style id=\"stage14-stock-style\">\n#s14-launch{position:fixed;z-index:99990;right:18px;top:18px;border:1px solid #54718a;border-radius:12px;background:#142638;color:#f3f7fb;padding:11px 15px;font:700 12px system-ui;letter-spacing:.08em;cursor:pointer;box-shadow:0 8px 28px #0008}\n#s14-launch:hover{background:#203c54}\n#s14-wrap{position:fixed;z-index:99991;inset:0;background:#07111de8;display:none;align-items:center;justify-content:center;padding:16px;font:14px system-ui;color:#e9f1f8}\n#s14-panel{width:min(980px,100%);max-height:92vh;overflow:auto;background:#101f30;border:1px solid #304b63;border-radius:18px;box-shadow:0 24px 80px #000b}\n#s14-panel *{box-sizing:border-box}\n.s14-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #2b4054}\n.s14-head h2{margin:0;font-size:19px}.s14-sub{color:#9eb2c4;font-size:12px;margin-top:4px}\n.s14-close,.s14-btn{border:1px solid #48627a;background:#1b3349;color:#eaf3fb;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:650}\n.s14-close{font-size:18px;padding:5px 11px}\n.s14-tabs{display:flex;gap:7px;flex-wrap:wrap;padding:13px 18px 0}\n.s14-tab{border:1px solid #344e64;background:#172a3c;color:#b8c9d8;border-radius:9px;padding:9px 13px;cursor:pointer}\n.s14-tab.active{background:#254b68;color:white;border-color:#6ca8ce}\n.s14-body{padding:16px 20px 22px}\n.s14-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}\n.s14-stat{background:#172a3c;border:1px solid #2b4359;border-radius:12px;padding:12px}\n.s14-stat b{display:block;font-size:21px}.s14-stat span{color:#9eb2c4;font-size:11px;text-transform:uppercase;letter-spacing:.07em}\n.s14-table{width:100%;border-collapse:collapse;font-size:13px}.s14-table th,.s14-table td{padding:11px 9px;text-align:left;border-bottom:1px solid #263b4e}.s14-table th{color:#9eb2c4;font-size:11px;text-transform:uppercase;letter-spacing:.06em}\n.s14-pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;background:#243b4d;color:#c6d9e8}.s14-low{background:#503b22;color:#ffd99b}.s14-good{background:#1d493b;color:#a8f0d1}.s14-bad{background:#552d35;color:#ffc0c8}\n.s14-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.s14-row select,.s14-row input{background:#0d1b29;color:#eaf3fb;border:1px solid #3a5268;border-radius:8px;padding:8px;min-width:80px}\n.s14-btn.primary{background:#27628a;border-color:#468ab5}.s14-btn:disabled{opacity:.4;cursor:not-allowed}\n.s14-card{background:#172a3c;border:1px solid #2b4359;border-radius:12px;padding:14px;margin-bottom:10px}\n.s14-empty{padding:28px;text-align:center;color:#9eb2c4}\n@media(max-width:600px){#s14-launch{top:10px;right:10px;padding:9px 11px}.s14-head,.s14-body{padding-left:13px;padding-right:13px}.s14-stats{grid-template-columns:1fr 1fr}.s14-table{font-size:12px}.s14-table th,.s14-table td{padding:8px 5px}}\n</style>\n<button id=\"s14-launch\" type=\"button\">STOCK &amp; ORDERS</button>\n<div id=\"s14-wrap\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Stock and ordering management\">\n <section id=\"s14-panel\">\n  <header class=\"s14-head\"><div><h2>Stock &amp; Ordering</h2><div class=\"s14-sub\">Stage 14 · Product ordering and inventory desk</div></div><button class=\"s14-close\" id=\"s14-close\" aria-label=\"Close\">×</button></header>\n  <nav class=\"s14-tabs\" id=\"s14-tabs\">\n   <button class=\"s14-tab active\" data-tab=\"stock\">Stock overview</button><button class=\"s14-tab\" data-tab=\"order\">Place order</button><button class=\"s14-tab\" data-tab=\"deliveries\">Incoming deliveries</button><button class=\"s14-tab\" data-tab=\"shelves\">Shelf compatibility</button>\n  </nav>\n  <main class=\"s14-body\" id=\"s14-content\"></main>\n </section>\n</div>\n<script id=\"stage14-stock-script\">\n(()=>{\n const KEY='mps_stage14_inventory_v1';\n const initial=[\n  ['Apples','Produce','ambient',34,18],['Bread','Bakery','bakery',12,16],['Milk','Dairy','chilled',9,20],['Eggs','Dairy','chilled',15,12],['Cheese','Dairy','chilled',8,14],['Cereal','Pantry','ambient',26,12],['Pasta','Pantry','ambient',41,15],['Juice','Drinks','chilled',11,16],['Frozen Pizza','Frozen','frozen',7,12],['Ice Cream','Frozen','frozen',5,10],['Flowers','Specialty','display',6,8],['Chocolate','Snacks','ambient',19,14]\n ].map((p,i)=>({id:i+1,name:p[0],category:p[1],type:p[2],stock:p[3],min:p[4],shelf:p[2]}));\n let state;\n try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}\n if(!state||!Array.isArray(state.products))state={products:initial,deliveries:[],nextId:1};\n state.products=state.products.map(p=>({...p,min:Number(p.min)||10,stock:Number(p.stock)||0}));\n const emit=()=>window.dispatchEvent(new CustomEvent('mps:inventory:changed',{detail:{version:1,products:state.products.map(p=>({...p})),deliveries:state.deliveries.map(d=>({...d}))}}));\n const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));emit()};\n const findProduct=id=>state.products.find(p=>p.id===Number(id)||p.name.toLowerCase()===String(id).toLowerCase());\n window.MPSInventory=Object.freeze({\n  version:1,\n  getSnapshot:()=>JSON.parse(JSON.stringify(state)),\n  getProducts:()=>state.products.map(p=>({...p})),\n  getDeliveries:()=>state.deliveries.map(d=>({...d})),\n  getStock:id=>{const p=findProduct(id);return p?p.stock:null},\n  setStock:(id,quantity,source='external')=>{const p=findProduct(id),n=Number(quantity);if(!p||!Number.isFinite(n)||n<0)return false;p.stock=Math.floor(n);save();window.dispatchEvent(new CustomEvent('mps:inventory:stock-adjusted',{detail:{productId:p.id,product:p.name,quantity:p.stock,source}}));return true},\n  adjustStock:(id,delta,source='external')=>{const p=findProduct(id),n=Number(delta);if(!p||!Number.isFinite(n))return false;p.stock=Math.max(0,Math.floor(p.stock+n));save();window.dispatchEvent(new CustomEvent('mps:inventory:stock-adjusted',{detail:{productId:p.id,product:p.name,quantity:p.stock,source}}));return p.stock},\n  addProduct:product=>{if(!product||!String(product.name||'').trim())return false;const name=String(product.name).trim();if(state.products.some(p=>p.name.toLowerCase()===name.toLowerCase()))return false;const id=Math.max(0,...state.products.map(p=>Number(p.id)||0))+1;const allowed=['ambient','chilled','frozen','bakery','display'];const type=allowed.includes(product.type)?product.type:'ambient';state.products.push({id,name,category:String(product.category||'General').slice(0,40),type,stock:Math.max(0,Math.floor(Number(product.stock)||0)),min:Math.max(0,Math.floor(Number(product.min)||0)),shelf:type});save();render();return id},\n  createOrder:(id,quantity)=>{const p=findProduct(id),qty=Math.floor(Number(quantity));if(!p||!Number.isFinite(qty)||qty<1||qty>500)return false;const order={id:state.nextId++,productId:p.id,name:p.name,qty,created:new Date().toISOString(),status:'Ordered'};state.deliveries.push(order);save();render();return {...order}},\n  receiveDelivery:id=>{const d=state.deliveries.find(x=>x.id===Number(id));if(!d||d.status==='Received')return false;const p=state.products.find(x=>x.id===d.productId);if(!p)return false;p.stock+=d.qty;d.status='Received';d.received=new Date().toISOString();save();render();return true},\n  setShelfType:(id,type)=>{const p=findProduct(id),allowed=['ambient','chilled','frozen','bakery','display'];if(!p||!allowed.includes(type))return false;p.shelf=type;save();render();return p.type===p.shelf},\n  importBackup:data=>{if(!data||!Array.isArray(data.products)||!Array.isArray(data.deliveries)||!data.products.length)return false;const products=data.products.filter(p=>p&&String(p.name||'').trim()).map((p,i)=>({id:Number(p.id)||i+1,name:String(p.name).slice(0,80),category:String(p.category||'General').slice(0,40),type:['ambient','chilled','frozen','bakery','display'].includes(p.type)?p.type:'ambient',stock:Math.max(0,Math.floor(Number(p.stock)||0)),min:Math.max(0,Math.floor(Number(p.min)||0)),shelf:['ambient','chilled','frozen','bakery','display'].includes(p.shelf)?p.shelf:(['ambient','chilled','frozen','bakery','display'].includes(p.type)?p.type:'ambient')}));if(!products.length)return false;state.products=products;state.deliveries=data.deliveries.filter(d=>d&&products.some(p=>p.id===Number(d.productId))).map(d=>({id:Number(d.id)||0,productId:Number(d.productId),name:String(d.name||''),qty:Math.max(1,Math.floor(Number(d.qty)||1)),created:d.created||new Date().toISOString(),status:d.status==='Received'?'Received':'Ordered',received:d.received||null}));state.nextId=Math.max(1,Math.floor(Number(data.nextId)||1),...state.deliveries.map(d=>d.id+1));save();render();return true},\n  subscribe:callback=>{if(typeof callback!=='function')return()=>{};const listener=e=>callback(e.detail);window.addEventListener('mps:inventory:changed',listener);return()=>window.removeEventListener('mps:inventory:changed',listener)}\n });\n\n const el=id=>document.getElementById(id);\n const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n const money=n=>String(n);\n const header=el('s14-panel').querySelector('.s14-head');\n const dataTools=document.createElement('div');dataTools.className='s14-row';dataTools.style.marginLeft='auto';\n dataTools.innerHTML='<button class=\"s14-btn\" id=\"s14-export\">Export backup</button><button class=\"s14-btn\" id=\"s14-import-trigger\">Import backup</button><input id=\"s14-import-file\" type=\"file\" accept=\"application/json,.json\" hidden>';\n header.insertBefore(dataTools,el('s14-close'));\n el('s14-export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(window.MPSInventory.getSnapshot(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='my-perfect-supermarket-inventory.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});\n el('s14-import-trigger').addEventListener('click',()=>el('s14-import-file').click());\n el('s14-import-file').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!window.MPSInventory.importBackup(data))alert('This backup is not a valid Stage 14 inventory file.');else{active='stock';tabs.forEach(x=>x.classList.toggle('active',x.dataset.tab==='stock'));render()}}catch(error){alert('Could not read that backup file.')}e.target.value=''});\n\n const tabs=Array.from(document.querySelectorAll('.s14-tab'));\n let active='stock';\n function open(){el('s14-wrap').style.display='flex';render()}\n function close(){el('s14-wrap').style.display='none'}\n el('s14-launch').addEventListener('click',open);el('s14-close').addEventListener('click',close);\n el('s14-wrap').addEventListener('click',e=>{if(e.target===el('s14-wrap'))close()});\n document.addEventListener('keydown',e=>{if(e.key==='Escape'&&el('s14-wrap').style.display==='flex')close()});\n tabs.forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tab;tabs.forEach(x=>x.classList.toggle('active',x===b));render()}));\n function stats(){let low=state.products.filter(p=>p.stock<=p.min).length;return '<div class=\"s14-stats\"><div class=\"s14-stat\"><b>'+state.products.reduce((a,p)=>a+p.stock,0)+'</b><span>Units in stock</span></div><div class=\"s14-stat\"><b>'+low+'</b><span>Products to replenish</span></div><div class=\"s14-stat\"><b>'+state.deliveries.length+'</b><span>Open deliveries</span></div></div>'}\n function render(){\n  let html=stats();\n  if(active==='stock'){\n   html+='<div class=\"s14-row\" style=\"justify-content:space-between;margin-bottom:10px\"><b>Current product levels</b><span class=\"s14-pill\">Low stock threshold shown per product</span></div><table class=\"s14-table\"><thead><tr><th>Product</th><th>Department</th><th>On hand</th><th>Reorder at</th><th>Status</th></tr></thead><tbody>';\n   state.products.forEach(p=>{let low=p.stock<=p.min;html+='<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.category)+'</td><td>'+p.stock+'</td><td>'+p.min+'</td><td><span class=\"s14-pill '+(low?'s14-low':'s14-good')+'\">'+(low?'Replenish':'Healthy')+'</span></td></tr>'});\n   html+='</tbody></table>';\n  }else if(active==='order'){\n   html+='<div class=\"s14-card\"><b>Create a supplier order</b><p class=\"s14-sub\">Choose a product and quantity. Orders appear under Incoming deliveries until received.</p><div class=\"s14-row\"><select id=\"s14-product\">'+state.products.map(p=>'<option value=\"'+p.id+'\">'+esc(p.name)+' · '+p.stock+' in stock</option>').join('')+'</select><input id=\"s14-qty\" type=\"number\" min=\"1\" max=\"500\" value=\"12\" aria-label=\"Order quantity\"><button class=\"s14-btn primary\" id=\"s14-place\">Add to order</button></div></div><table class=\"s14-table\"><thead><tr><th>Product</th><th>Stock</th><th>Suggested order</th></tr></thead><tbody>'+state.products.filter(p=>p.stock<=p.min).map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.stock+'</td><td>'+(Math.max(1,p.min*2-p.stock))+' units</td></tr>').join('')+'</tbody></table>';\n   setTimeout(()=>{let b=el('s14-place');if(b)b.onclick=()=>{let p=state.products.find(x=>x.id===Number(el('s14-product').value));let q=Math.max(1,Math.min(500,Number(el('s14-qty').value)||1));if(p){state.deliveries.push({id:state.nextId++,productId:p.id,name:p.name,qty:q,created:new Date().toISOString(),status:'Ordered'});save();render()}}},0);\n  }else if(active==='deliveries'){\n   html+='<b>Supplier deliveries</b>';\n   if(!state.deliveries.length)html+='<div class=\"s14-empty\">No incoming orders yet. Place an order to see it here.</div>';\n   state.deliveries.forEach(d=>{html+='<div class=\"s14-card\"><div class=\"s14-row\" style=\"justify-content:space-between\"><div><b>'+esc(d.name)+'</b><div class=\"s14-sub\">Order #'+d.id+' · '+d.qty+' units · '+new Date(d.created).toLocaleString()+'</div></div><span class=\"s14-pill '+(d.status==='Received'?'s14-good':'s14-low')+'\">'+d.status+'</span></div>'+(d.status==='Received'?'':'<div style=\"margin-top:12px\"><button class=\"s14-btn primary\" data-receive=\"'+d.id+'\">Receive delivery</button></div>')+'</div>'});\n   setTimeout(()=>document.querySelectorAll('[data-receive]').forEach(b=>b.onclick=()=>{let d=state.deliveries.find(x=>x.id===Number(b.dataset.receive));if(d&&d.status!=='Received'){let p=state.products.find(x=>x.id===d.productId);if(p)p.stock+=d.qty;d.status='Received';d.received=new Date().toISOString();save();render()}}),0);\n  }else{\n   html+='<b>Storage and display compatibility</b><p class=\"s14-sub\">Assign a suitable fixture type to each product. Incompatible assignments are flagged for review.</p><table class=\"s14-table\"><thead><tr><th>Product</th><th>Required fixture</th><th>Assigned fixture</th><th>Check</th></tr></thead><tbody>';\n   const types=['ambient','chilled','frozen','bakery','display'];\n   state.products.forEach(p=>{let ok=p.type===p.shelf;html+='<tr><td>'+esc(p.name)+'</td><td>'+p.type+'</td><td><select data-shelf=\"'+p.id+'\">'+types.map(t=>'<option '+(t===p.shelf?'selected':'')+' value=\"'+t+'\">'+t+'</option>').join('')+'</select></td><td><span class=\"s14-pill '+(ok?'s14-good':'s14-bad')+'\">'+(ok?'Compatible':'Check fixture')+'</span></td></tr>'});\n   html+='</tbody></table>';\n   setTimeout(()=>document.querySelectorAll('[data-shelf]').forEach(s=>s.onchange=()=>{let p=state.products.find(x=>x.id===Number(s.dataset.shelf));if(p){p.shelf=s.value;save();render()}}),0);\n  }\n  el('s14-content').innerHTML=html;\n  if(active==='stock'){\n   const tools=document.createElement('div');tools.className='s14-card';\n   tools.innerHTML='<b>Stock controls</b><p class=\"s14-sub\">Adjust counts or add products to this inventory.</p><div class=\"s14-row\"><select id=\"s14-adjust-product\">'+state.products.map(p=>'<option value=\"'+p.id+'\">'+esc(p.name)+' · '+p.stock+' units</option>').join('')+'</select><input id=\"s14-adjust-qty\" type=\"number\" min=\"1\" max=\"9999\" value=\"1\" aria-label=\"Adjustment quantity\"><button class=\"s14-btn primary\" id=\"s14-add-stock\">Add stock</button><button class=\"s14-btn\" id=\"s14-remove-stock\">Remove stock</button></div><div style=\"height:12px\"></div><b>Add a product</b><div class=\"s14-row\" style=\"margin-top:8px\"><input id=\"s14-new-name\" maxlength=\"80\" placeholder=\"Product name\" aria-label=\"Product name\"><select id=\"s14-new-category\"><option>General</option><option>Produce</option><option>Bakery</option><option>Dairy</option><option>Pantry</option><option>Drinks</option><option>Frozen</option><option>Snacks</option><option>Specialty</option></select><select id=\"s14-new-type\" aria-label=\"Required fixture\"><option value=\"ambient\">Ambient</option><option value=\"chilled\">Chilled</option><option value=\"frozen\">Frozen</option><option value=\"bakery\">Bakery</option><option value=\"display\">Display</option></select><input id=\"s14-new-stock\" type=\"number\" min=\"0\" value=\"0\" aria-label=\"Opening stock\" placeholder=\"Opening stock\"><input id=\"s14-new-min\" type=\"number\" min=\"0\" value=\"10\" aria-label=\"Reorder threshold\" placeholder=\"Reorder at\"><button class=\"s14-btn primary\" id=\"s14-create-product\">Add product</button></div><div class=\"s14-sub\" id=\"s14-stock-message\" aria-live=\"polite\" style=\"margin-top:8px\"></div>';\n   el('s14-content').appendChild(tools);\n   const adjust=(sign)=>{const p=state.products.find(x=>x.id===Number(el('s14-adjust-product').value));const q=Math.floor(Number(el('s14-adjust-qty').value));if(!p||!Number.isFinite(q)||q<1){el('s14-stock-message').textContent='Enter a quantity greater than zero.';return}window.MPSInventory.adjustStock(p.id,sign*q,'management-desk')};\n   el('s14-add-stock').onclick=()=>adjust(1);el('s14-remove-stock').onclick=()=>adjust(-1);\n   el('s14-create-product').onclick=()=>{const name=el('s14-new-name').value.trim();if(!name){el('s14-stock-message').textContent='Enter a product name.';return}const id=window.MPSInventory.addProduct({name,category:el('s14-new-category').value,type:el('s14-new-type').value,stock:el('s14-new-stock').value,min:el('s14-new-min').value});if(!id)el('s14-stock-message').textContent='That product already exists, or the name is invalid.'};\n  }\n\n }\n})();\n<\/script>"
  const closeAt=html.toLowerCase().lastIndexOf('</body>');
  if(closeAt>=0)html=html.slice(0,closeAt)+stage14Addon+html.slice(closeAt);
  document.open();document.write(html);document.close();
 }catch(error){
  status.textContent='The game could not start: '+(error&&error.message?error.message:String(error));
  status.style.color='#ffb4a9';
 }
})();
</script>
</body>
</html>
